[package]
name = "offgate"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Testlerde gercek Ed25519 imzasi uretmek icin. Kontrat koduna girmez.
ed25519-dalek = "2"
hex = "0.4"
