; OffGate — kapi donanimi
; ESP32, wifi AP + captive portal, Ed25519 dogrulama, NVS.
; Icinde hicbir gizli anahtar yok; yalnizca operatorun acik anahtari gomulu.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    rweather/Crypto@^0.4.0          ; Ed25519::verify
    bblanchon/ArduinoJson@^7.0.0    ; fis JSON'u

build_flags =
    -DCORE_DEBUG_LEVEL=1
