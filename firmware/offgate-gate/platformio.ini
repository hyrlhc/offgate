; OffGate — kapi donanimi
; ESP32, wifi AP + captive portal, Ed25519 dogrulama, NVS.
; Icinde hicbir gizli anahtar yok; yalnizca operatorun acik anahtari gomulu.

; Ortak ayarlar. Iki kapi da ayni kodu calistirir; tek fark kapi kimligi.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; NVS'i buyutmek icin bolum tablosunu degistirmeyi denedim; esp32dev'de
; onyukleyici uygulamayi bulamayip reset dongusune girdi. Varsayilan tabloda
; kaliyoruz — fis defteri sinirlidir, bkz. store_receipt / /health "lost".

lib_deps =
    rweather/Crypto@^0.4.0          ; Ed25519::verify
    bblanchon/ArduinoJson@^7.0.0    ; fis JSON'u

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Kapi kimligi derleme zamaninda belirlenir — ayni firmware, farkli kapilar.
; Sozlesmedeki `register_gate` ile birebir ayni olmali; kullaniciya "Kapi 1 /
; Kapi 2" diye gosterilir (web/src/config.ts icindeki GATE_LABELS).
;
;   pio run -e gate1 -t upload    -> Kapi 1 (M307)
;   pio run -e gate2 -t upload    -> Kapi 2 (M308)

[env:gate1]
build_flags = ${env.build_flags} -DOFFGATE_GATE_ID='"M307"'

[env:gate2]
build_flags = ${env.build_flags} -DOFFGATE_GATE_ID='"M308"'
